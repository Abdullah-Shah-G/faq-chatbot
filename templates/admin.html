<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAQ Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-5xl mx-auto p-4">
    <header class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-gray-900">FAQ Manager</h1>
      <a href="/" class="text-sm text-blue-600 hover:underline">Back to Chat</a>
    </header>

    <div id="toast" class="hidden fixed top-4 right-4 bg-green-600 text-white px-4 py-2 rounded shadow"></div>

    <div class="bg-white rounded-lg shadow overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b">
          <tr>
            <th class="text-left px-4 py-3 font-medium text-gray-600 w-16">ID</th>
            <th class="text-left px-4 py-3 font-medium text-gray-600">Question</th>
            <th class="text-left px-4 py-3 font-medium text-gray-600">Answer</th>
            <th class="text-left px-4 py-3 font-medium text-gray-600 w-40">Tags</th>
            <th class="text-left px-4 py-3 font-medium text-gray-600 w-32">Actions</th>
          </tr>
        </thead>
        <tbody id="faq-body"></tbody>
      </table>
    </div>

    <div class="flex gap-2 mt-4">
      <button onclick="addEntry()" class="bg-gray-600 text-white px-4 py-2 rounded hover:bg-gray-700">Add Entry</button>
      <button onclick="saveAll()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Save Changes</button>
      <button onclick="resetAll()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">Reset to Defaults</button>
    </div>

    <p class="text-xs text-gray-400 mt-4">FAQ data is stored server-side in data/faqs.json. Restart the server after editing to refresh seed data.</p>
  </div>

  <script>
    const DEFAULTS = [
      { id: "1", question: "What is your refund policy?", answer: "We offer refunds within 30 days for unused subscriptions.", tags: ["refund", "billing"], last_updated: "2026-01-15" },
      { id: "2", question: "How do I reset my password?", answer: "Go to Settings > Security > Reset Password.", tags: ["password", "account"], last_updated: "2026-02-10" },
      { id: "3", question: "What payment methods do you accept?", answer: "We accept Visa, Mastercard, Amex, PayPal, and ACH.", tags: ["payment", "billing"], last_updated: "2026-03-01" },
      { id: "4", question: "Can I upgrade or downgrade my plan?", answer: "Yes, from Settings > Billing > Plan. Changes apply next cycle.", tags: ["plan", "upgrade"], last_updated: "2026-01-20" },
      { id: "5", question: "Do you have a mobile app?", answer: "Yes, on iOS App Store and Google Play.", tags: ["mobile", "app"], last_updated: "2026-02-28" },
      { id: "6", question: "How do I invite team members?", answer: "Settings > Team > Invite Members.", tags: ["team", "invite"], last_updated: "2026-03-05" },
      { id: "7", question: "Is my data secure?", answer: "Yes, AES-256 at rest, TLS 1.3 in transit. SOC 2 & GDPR compliant.", tags: ["security", "gdpr"], last_updated: "2026-02-01" },
      { id: "8", question: "What is your uptime SLA?", answer: "99.9% for paid plans, 99.99% for Enterprise.", tags: ["uptime", "sla"], last_updated: "2026-01-10" },
    ];

    let faqs = {{ faqs }};

    function render() {
      const tbody = document.getElementById("faq-body");
      tbody.innerHTML = faqs.map(f => \`
        <tr class="border-b hover:bg-gray-50" data-id="\${f.id}">
          <td class="px-4 py-2 text-gray-500">\${f.id}</td>
          <td class="px-4 py-2">
            <div class="text-display">\${f.question}</div>
            <div class="text-edit hidden">
              <input value="\${f.question.replace(/"/g, '&quot;')}" class="w-full border rounded px-2 py-1 text-sm question-input" />
            </div>
          </td>
          <td class="px-4 py-2">
            <div class="text-display">\${f.answer}</div>
            <div class="text-edit hidden">
              <textarea class="w-full border rounded px-2 py-1 text-sm answer-input" rows="2">\${f.answer}</textarea>
            </div>
          </td>
          <td class="px-4 py-2">
            <div class="text-display">\${f.tags.join(", ")}</div>
            <div class="text-edit hidden">
              <input value="\${f.tags.join(", ")}" class="w-full border rounded px-2 py-1 text-sm tags-input" placeholder="comma separated" />
            </div>
          </td>
          <td class="px-4 py-2">
            <div class="text-display flex gap-1">
              <button onclick="startEdit('\${f.id}')" class="text-blue-600 hover:underline text-xs">Edit</button>
              <button onclick="deleteEntry('\${f.id}')" class="text-red-600 hover:underline text-xs">Delete</button>
            </div>
            <div class="text-edit hidden flex gap-1">
              <button onclick="confirmEdit('\${f.id}')" class="text-green-600 hover:underline text-xs">Save</button>
              <button onclick="cancelEdit('\${f.id}')" class="text-gray-600 hover:underline text-xs">Cancel</button>
            </div>
          </td>
        </tr>
      \`).join("");
    }

    function startEdit(id) {
      const row = document.querySelector(\`tr[data-id="\${id}"]\`);
      row.querySelectorAll(".text-display").forEach(el => el.classList.add("hidden"));
      row.querySelectorAll(".text-edit").forEach(el => el.classList.remove("hidden"));
    }

    function cancelEdit(id) {
      const row = document.querySelector(\`tr[data-id="\${id}"]\`);
      row.querySelectorAll(".text-display").forEach(el => el.classList.remove("hidden"));
      row.querySelectorAll(".text-edit").forEach(el => el.classList.add("hidden"));
    }

    function confirmEdit(id) {
      const row = document.querySelector(\`tr[data-id="\${id}"]\`);
      const faq = faqs.find(f => f.id === id);
      if (!faq) return;
      faq.question = row.querySelector(".question-input").value;
      faq.answer = row.querySelector(".answer-input").value;
      faq.tags = row.querySelector(".tags-input").value.split(",").map(t => t.trim());
      faq.last_updated = new Date().toISOString().split("T")[0];
      cancelEdit(id);
    }

    function deleteEntry(id) {
      if (!confirm("Delete this FAQ entry?")) return;
      faqs = faqs.filter(f => f.id !== id);
      render();
    }

    function addEntry() {
      const id = String(Date.now());
      faqs.push({ id, question: "New question", answer: "New answer", tags: [], last_updated: new Date().toISOString().split("T")[0] });
      render();
      startEdit(id);
    }

    async function saveAll() {
      try {
        const res = await fetch("/api/faq", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(faqs),
        });
        if (res.ok) showToast("Saved!");
        else showToast("Save failed");
      } catch {
        showToast("Save failed");
      }
    }

    async function resetAll() {
      if (!confirm("Reset to defaults?")) return;
      faqs = JSON.parse(JSON.stringify(DEFAULTS));
      render();
      await saveAll();
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.remove("hidden");
      setTimeout(() => t.classList.add("hidden"), 2000);
    }

    render();
  </script>
</body>
</html>
