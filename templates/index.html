<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAQ Chatbot</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-3xl mx-auto p-4">
    <header class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">FAQ Chatbot</h1>
        <p class="text-gray-500 text-sm">Ask a question about our product</p>
      </div>
      <a href="/admin" class="text-sm text-blue-600 hover:underline">Manage FAQs</a>
    </header>

    <div id="messages" class="space-y-4 mb-4"></div>

    <div id="empty-state" class="text-center py-16 text-gray-400">
      <p class="text-lg">Ask me anything about our product</p>
      <p class="text-sm mt-1">Try: "What's your refund policy?" or "How do I reset my password?"</p>
    </div>

    <form id="chat-form" class="flex gap-2">
      <input
        type="text"
        id="message-input"
        class="flex-1 rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Type your question..."
        autocomplete="off"
      />
      <button
        type="submit"
        class="bg-blue-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-blue-700 disabled:opacity-50"
      >
        Send
      </button>
    </form>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const emptyEl = document.getElementById("empty-state");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message-input");

    function addMessage(role, content) {
      emptyEl?.remove();
      const div = document.createElement("div");
      div.className = role === "user" ? "text-right" : "text-left";
      div.innerHTML = \`
        <div class="inline-block rounded-lg px-4 py-3 max-w-[80%] \${
          role === "user" ? "bg-blue-600 text-white" : "bg-white border border-gray-200 text-gray-800"
        }">
          <p class="text-sm whitespace-pre-wrap">\${content}</p>
        </div>
      \`;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addMessage("user", message);
      input.value = "";
      input.disabled = true;
      form.querySelector("button").disabled = true;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });
        const data = await res.json();
        addMessage("assistant", data.reply || "No response.");
      } catch {
        addMessage("assistant", "Sorry, something went wrong. Please try again.");
      } finally {
        input.disabled = false;
        form.querySelector("button").disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
